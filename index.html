<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horarios</title>  <!-- Firebase -->  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBODZcEB4yIm2-UjpjveBy2tr7RDT-hYo",
      authDomain: "estudio-sermiteop.firebaseapp.com",
      databaseURL: "https://estudio-sermiteop-default-rtdb.firebaseio.com",
      projectId: "estudio-sermiteop",
      storageBucket: "estudio-sermiteop.firebasestorage.app",
      messagingSenderId: "223030697007",
      appId: "1:223030697007:web:fe4aa6b863b7ebf521bada",
      measurementId: "G-NMD0ZC8ZX7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ===== ADMIN =====
    let esAdmin = false;
    const LLAVE = "Eduardo61101";

    window.desbloquearAdmin = () => {
      const clave = prompt("🔒 Ingresa la llave");
      if (clave === LLAVE) {
        esAdmin = true;
        document.getElementById("btnHome").style.display = "inline-block";
        alert("Modo admin activado 😎");
      } else {
        alert("Llave incorrecta ❌");
      }
    };

    // ===== CREAR HORARIO =====
    window.guardarHorario = async () => {
      if (!esAdmin) {
        alert("🔒 Solo admin");
        return;
      }

      const nombre = prompt("Nombre del horario");
      if (!nombre) return;

      const tablaHTML = document.getElementById("tabla").innerHTML;

      try {
        await push(ref(db, "horarios"), {
          nombre,
          tabla: tablaHTML
        });
        alert("Guardado ✅");
        verGuardados();
      } catch (err) {
        console.error(err);
        alert("Error al guardar ❌");
      }
    };

    // ===== VER HORARIOS =====
    window.verGuardados = () => {
      const cont = document.getElementById("listaHorarios");

      onValue(ref(db, "horarios"), (snapshot) => {
        cont.innerHTML = "";
        const data = snapshot.val();
        if (!data) {
          cont.innerHTML = "<p>No hay horarios</p>";
          return;
        }

        Object.entries(data).forEach(([id, h]) => {
          const card = document.createElement("div");
          card.className = "card";

          const titulo = document.createElement("div");
          titulo.className = "card-title";
          titulo.textContent = "📅 " + h.nombre;

          const contenido = document.createElement("div");
          contenido.className = "card-content";
          contenido.innerHTML = h.tabla;

          // toggle mostrar/ocultar
          titulo.onclick = () => {
            contenido.style.display =
              contenido.style.display === "none" ? "block" : "none";
          };

          card.appendChild(titulo);
          card.appendChild(contenido);
          cont.appendChild(card);
        });
      });
    };

    // cargar al inicio
    window.addEventListener("DOMContentLoaded", () => {
      verGuardados();
    });
  </script>  <style>
    body {
      font-family: system-ui, Arial;
      margin: 0;
      background: #f2f4f8;
    }

    header {
      background: #4f46e5;
      color: white;
      padding: 12px;
      text-align: center;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 8px;
      padding: 10px;
      justify-content: center;
      background: white;
      position: sticky;
      top: 0;
    }

    button {
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      background: #e5e7eb;
      font-weight: bold;
    }

    #btnHome {
      display: none;
      background: #4f46e5;
      color: white;
    }

    .container {
      padding: 14px;
      max-width: 600px;
      margin: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    td, th {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      overflow: hidden;
    }

    .card-title {
      padding: 14px;
      font-weight: bold;
      background: #eef2ff;
      cursor: pointer;
    }

    .card-content {
      display: none;
      padding: 10px;
    }

    .lock {
      position: fixed;
      bottom: 16px;
      right: 16px;
      font-size: 24px;
      background: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,.2);
      cursor: pointer;
    }
  </style></head><body>
  <header>📚 Horarios</header>  <nav>
    <button id="btnHome">Home</button>
    <button onclick="verGuardados()">Horarios</button>
    <button onclick="guardarHorario()">Guardar horario</button>
  </nav>  <div class="container">
    <h3>Tu horario (editor)</h3><table id="tabla">
  <tr>
    <th>Hora</th>
    <th>Lunes</th>
    <th>Martes</th>
    <th>Miércoles</th>
    <th>Jueves</th>
    <th>Viernes</th>
  </tr>
  <tr>
    <td>1</td>
    <td>Mate</td>
    <td>Español</td>
    <td>Inglés</td>
    <td>Historia</td>
    <td>Ciencias</td>
  </tr>
</table>

<h3>📂 Horarios guardados</h3>
<div id="listaHorarios"></div>

  </div>  <div class="lock" onclick="desbloquearAdmin()">🔒</div>
</body>
  </html>
