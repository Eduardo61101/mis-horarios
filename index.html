<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horarios</title>  <!-- Firebase -->  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>  <style>
    body{
      font-family: system-ui, Arial;
      margin:0;
      background:#f4f6fb;
    }

    header{
      background:#6c63ff;
      color:white;
      padding:14px;
      text-align:center;
      font-weight:700;
      font-size:18px;
    }

    nav{
      display:flex;
      gap:8px;
      padding:10px;
      background:white;
      border-bottom:1px solid #eee;
      justify-content:center;
      flex-wrap:wrap;
    }

    button{
      border:none;
      padding:10px 14px;
      border-radius:12px;
      background:#e9ecff;
      font-weight:600;
      cursor:pointer;
    }

    button.primary{
      background:#6c63ff;
      color:white;
    }

    .screen{ display:none; padding:14px; }
    .active{ display:block; }

    .card{
      background:white;
      padding:14px;
      border-radius:16px;
      margin-bottom:10px;
      box-shadow:0 4px 14px rgba(0,0,0,.06);
    }

    /* Candado */
    .lock{
      position:fixed;
      right:14px;
      bottom:14px;
      width:56px;
      height:56px;
      border-radius:50%;
      background:#6c63ff;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      cursor:pointer;
      box-shadow:0 6px 18px rgba(0,0,0,.25);
      z-index:999;
    }
  </style></head>
<body><header>📅 Horarios</header><nav id="navBar"></nav><!-- HOME (solo admin) --><div id="home" class="screen">
  <div class="card">
    <h3>Crear horario escolar</h3>
    <input id="nombreHorario" placeholder="Nombre del horario" style="width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;margin-bottom:10px;">
    <button class="primary" onclick="guardarHorario()">Guardar horario</button>
  </div>
</div><!-- HORARIOS (público) --><div id="horarios" class="screen active"></div><!-- Candado --><div class="lock" onclick="activarAdmin()">🔒</div><script>
  // 🔥 Firebase config (TUYA)
  const firebaseConfig = {
    apiKey: "AIzaSyBBODZcEB4yIm2-UjpjveBy2tr7RDT-hYo",
    authDomain: "estudio-sermiteop.firebaseapp.com",
    databaseURL: "https://estudio-sermiteop-default-rtdb.firebaseio.com",
    projectId: "estudio-sermiteop",
    storageBucket: "estudio-sermiteop.firebasestorage.app",
    messagingSenderId: "223030697007",
    appId: "1:223030697007:web:fe4aa6b863b7ebf521bada",
    measurementId: "G-NMD0ZC8ZX7"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const ADMIN_KEY = "Eduardo61101";
  let esAdmin = false;

  // 🔐 Activar modo admin
  function activarAdmin(){
    const key = prompt("🔑 Llave de administrador");
    if(key === ADMIN_KEY){
      esAdmin = true;
      alert("Modo admin activado 😎");
      renderNav();
      mostrar('home');
    }else{
      alert("Llave incorrecta");
    }
  }

  // 🧭 Navegación dinámica
  function renderNav(){
    const nav = document.getElementById('navBar');

    if(esAdmin){
      nav.innerHTML = `
        <button onclick="mostrar('home')">Home</button>
        <button onclick="mostrar('horarios')">Horarios</button>
      `;
    }else{
      nav.innerHTML = `
        <button onclick="mostrar('horarios')">Horarios</button>
      `;
    }
  }

  function mostrar(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // 💾 Guardar horario (solo admin)
  function guardarHorario(){
    if(!esAdmin){
      alert("No autorizado");
      return;
    }

    const nombre = document.getElementById('nombreHorario').value.trim();
    if(!nombre) return alert("Pon un nombre");

    const ref = db.ref('horarios').push();
    ref.set({ nombre });

    document.getElementById('nombreHorario').value = '';
  }

  // 👀 Ver horarios en vivo
  function escucharHorarios(){
    const cont = document.getElementById('horarios');

    db.ref('horarios').on('value', snap=>{
      cont.innerHTML='';
      snap.forEach(h=>{
        const data = h.val();
        const div = document.createElement('div');
        div.className='card';

        div.innerHTML = `
          <b>${data.nombre}</b>
          ${esAdmin ? `<br><button onclick="borrarHorario('${h.key}')">🗑 Borrar</button>` : ''}
        `;

        cont.appendChild(div);
      });
    });
  }

  function borrarHorario(id){
    if(!esAdmin) return;
    db.ref('horarios/'+id).remove();
  }

  // init
  renderNav();
  escucharHorarios();
</script></body>
</html>
